<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a0d"><title>카트먼 때리기 | 실시간 클리커</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
  <header><h1>카트먼 <span>때리기</span></h1><p>눌러서 점수를 모으고 실시간으로 겨뤄 보세요.</p></header>
  <section id="entry" class="panel entry"><label for="nickname">닉네임</label><div class="entry-row"><input id="nickname" maxlength="16" autocomplete="nickname" placeholder="닉네임 입력"><button id="join">게임 시작</button></div><small id="entry-message">닉네임은 16자까지 입력할 수 있어요.</small></section>
    <section id="game" class="game-grid" hidden>
      <div class="panel play-panel">
        <div class="player-line"><span id="player-name"></span><span id="connection">연결 중…</span></div>
        <div class="score" id="score">0</div><div class="score-caption">점수</div>
        <div id="fever" class="fever" hidden>🔥 피버 타임 · 클릭당 5점</div>
        <button id="cartman" class="cartman" aria-label="카트먼을 클릭해서 점수 얻기"><img id="cartman-img" src="./normal.png" alt="카트먼"></button>
        <p class="hint">클릭하면 1점, 가끔 3점 · 피버 중 5점</p>
        <div class="helper-row"><div><strong>도우미 <span id="helper-count">0</span>명</strong><small>3초마다 한 명당 1점</small></div><button id="hire">도우미 고용 · 50점</button></div>
        <div id="helper-visuals" class="helpers" aria-label="고용한 도우미"></div>
      </div>
      <aside class="panel leaderboard"><div class="board-heading"><div><span class="eyebrow">LIVE BATTLE</span><h2>실시간 랭킹</h2></div><span class="live-dot">LIVE</span></div><ol id="ranking"></ol><p id="rank-empty">참가자를 기다리는 중…</p><small>접속 중인 플레이어 점수만 표시됩니다.</small></aside>
    </section>
    <footer>점수와 도우미는 접속 중에만 랭킹에 표시되며, 나가면 초기화됩니다.</footer>
  </main>
  <audio id="click-audio" src="./click.mp3" preload="auto"></audio>
  <script src="./firebase-config.js"></script><script type="module" src="./game.js"></script>
</body></html>
